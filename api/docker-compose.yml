version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: api-mais-gestao-db
    environment:
      POSTGRES_USER: compumais
      POSTGRES_PASSWORD: C0mpum415!33511861
      POSTGRES_DB: mais_gestao
    ports:
      - "0.0.0.0:1861:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U compumais -d mais_gestao" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: api-mais-gestao-pgbouncer
    environment:
      DB_USER: compumais
      DB_PASSWORD: C0mpum415!33511861
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mais_gestao
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
      AUTH_TYPE: scram-sha-256
    ports:
      - "0.0.0.0:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
