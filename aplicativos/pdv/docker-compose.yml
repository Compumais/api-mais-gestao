services:
  postgres:
    image: postgres:17
    container_name: pdv-mais-gestao-db
    environment:
      POSTGRES_USER: pdv
      POSTGRES_PASSWORD: pdv
      POSTGRES_DB: pdv_local
    ports:
      - "5433:5432"
    volumes:
      - pdv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdv -d pdv_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pdv_postgres_data:
