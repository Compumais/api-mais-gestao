# Publica version.json + Setup.exe do PDV em /opt/mais-gestao/pdv-updates na VPS.
name: Publicar update PDV

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou SHA (vazio = branch do dispatch)"
        required: false
        type: string

concurrency:
  group: publish-pdv-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Validar artefatos
        id: meta
        working-directory: pdv/installer/output
        run: |
          set -euo pipefail
          test -f version.json
          artifact="$(python3 -c 'import json;print(json.load(open("version.json"))["artifact"])')"
          test -f "$artifact"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "Publicando $artifact ($(stat -c%s "$artifact") bytes)"

      - name: Publicar na VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,REPO,SHA,ARTIFACT
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            mkdir -p /opt/mais-gestao/pdv-updates
            cd /opt/mais-gestao/pdv-updates
            AUTH="Authorization: Bearer ${GH_TOKEN}"
            ACCEPT="Accept: application/vnd.github.raw+json"
            API="https://api.github.com/repos/${REPO}/contents"
            curl -fsSL -H "$AUTH" -H "$ACCEPT" \
              -o version.json \
              "${API}/pdv/installer/output/version.json?ref=${SHA}"
            curl -fsSL -H "$AUTH" -H "$ACCEPT" \
              -o "${ARTIFACT}" \
              "${API}/pdv/installer/output/${ARTIFACT}?ref=${SHA}"
            ls -lh version.json "${ARTIFACT}"
            cat version.json
