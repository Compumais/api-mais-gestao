# Modelo de Nginx para Mais Gestão.
# Produção usa dois hosts:
#   - https://maisgestao.compumais.com  → Next.js :3000
#   - https://apimaisgestao.compumais.com → Fastify :3333
# TLS em produção é gerido pelo Certbot.

# --- API (web, PDV e Better Auth) ---
server {
    listen 80;
    server_name apimaisgestao.compumais.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3333;
        include /etc/nginx/snippets/mais-gestao-proxy-api.conf;
    }
}

# --- Front + proxy same-origin para a API ---
server {
    listen 80;
    server_name maisgestao.compumais.com;

    client_max_body_size 25m;

    # Rotas Next.js que também vivem em /api/*
    location ^~ /api/preview {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/mais-gestao-proxy-api.conf;
    }
    location ^~ /api/revalidate {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/mais-gestao-proxy-api.conf;
    }
    location ^~ /api/exit-preview {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/mais-gestao-proxy-api.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        include /etc/nginx/snippets/mais-gestao-proxy-api.conf;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3333/health;
        include /etc/nginx/snippets/mais-gestao-proxy-api.conf;
    }

    location /pdv/updates/ {
        proxy_pass http://127.0.0.1:3333;
        include /etc/nginx/snippets/mais-gestao-proxy-api.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/mais-gestao-proxy-api.conf;
    }
}
